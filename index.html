<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spin Analyzer</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #container { position: relative; width: 100vw; height: 100vh; }
  video, canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  video { display: none; }

  #topBar {
    position: absolute; top: 0; left: 0; width: 100%;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 12px; z-index: 10; pointer-events: none;
  }
  #topBar > * { pointer-events: auto; }

  #overlay {
    display: flex; flex-direction: column; gap: 6px;
  }
  .stat {
    background: rgba(0,0,0,0.6);
    border-left: 4px solid #888;
    color: #fff;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    width: fit-content;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    transition: border-color 0.2s;
  }
  .stat.good { border-color: #2ecc71; }
  .stat.okay { border-color: #f1c40f; }
  .stat.bad  { border-color: #e74c3c; }
  .stat.neutral { border-color: #00E0FF; }
  .stat .label { opacity: 0.75; font-weight: 400; font-size: 11px; display: block; }
  .stat .value { font-size: 19px; }

  .iconBtn {
    background: rgba(0,0,0,0.55);
    color: #fff; border: none; border-radius: 10px;
    padding: 8px 12px; font-size: 13px; font-weight: 600;
    margin-left: 6px;
  }
  #spinTypeSelect {
    background: rgba(0,0,0,0.55);
    color: #fff; border: none; border-radius: 10px;
    padding: 8px 10px; font-size: 13px; font-weight: 600;
  }
  #rightControls { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  #rightControls .row { display: flex; }

  #status {
    position: absolute; bottom: 0; left: 0; width: 100%;
    padding: 12px; text-align: center;
    color: #fff; font-size: 13px;
    background: rgba(0,0,0,0.5);
    z-index: 10;
  }
  #startBtn {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    padding: 16px 32px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 30px;
    border: none;
    background: #ff3b30;
    color: white;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }

  #recordBtn.recording { background: #2ecc71; }

  #settingsPanel {
    position: absolute; top: 60px; right: 12px; z-index: 30;
    background: rgba(20,20,20,0.92);
    color: #fff; border-radius: 14px; padding: 16px;
    width: 250px; display: none;
    font-size: 13px; max-height: 80vh; overflow-y: auto;
  }
  #settingsPanel.open { display: block; }
  #settingsPanel h3 { margin: 0 0 10px 0; font-size: 14px; }
  #settingsPanel .metricGroup { margin-top: 12px; }
  #settingsPanel label { display: block; margin-top: 8px; opacity: 0.85; }
  #settingsPanel .rangeRow { display: flex; align-items: center; gap: 8px; }
  #settingsPanel input[type=range] { flex: 1; }
  #settingsPanel .val { width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
  #settingsPanel .closeSettings {
    margin-top: 14px; width: 100%; padding: 8px; border-radius: 8px; border: none;
    background: #444; color: #fff; font-weight: 600;
  }
  #settingsPanel .autoToggleRow {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 4px; padding: 8px 0; border-bottom: 1px solid #333;
  }

  #summaryPanel {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    z-index: 40; background: rgba(15,15,15,0.95); color: #fff;
    border-radius: 16px; padding: 22px; width: 270px; display: none;
    text-align: center;
  }
  #summaryPanel.open { display: block; }
  #summaryPanel h2 { margin: 0 0 12px 0; font-size: 17px; }
  #summaryPanel .row { display: flex; justify-content: space-between; margin: 8px 0; font-size: 14px; }
  #summaryPanel .row .v { font-weight: 700; }

    background: rgba(255,255,255,0.06); border-radius: 10px; padding: 10px 12px;
    font-size: 12px;

<body>

  <canvas id="canvas"></canvas>

  <div id="topBar">
    <div id="overlay"></div>
    <div id="rightControls">
      <div class="row">
        <select id="spinTypeSelect"></select>
      </div>

      </div>
      <div class="row">
        <button class="iconBtn" id="recordBtn">● Manual rec</button>
      </div>
      <div class="row">

    <div id="historyList"></div>

<script type="module">
import {

} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const switchBtn = document.getElementById('switchBtn');
const settingsBtn = document.getElementById('settingsBtn');
const settingsPanel = document.getElementById('settingsPanel');
const closeSettings = document.getElementById('closeSettings');
const recordBtn = document.getElementById('recordBtn');
const summaryPanel = document.getElementById('summaryPanel');
const closeSummary = document.getElementById('closeSummary');
const fpsBadge = document.getElementById('fpsBadge');
const spinTypeSelect = document.getElementById('spinTypeSelect');
const autoDetectToggle = document.getElementById('autoDetectToggle');
const metricSlidersEl = document.getElementById('metricSliders');
const rotMinusBtn = document.getElementById('rotMinusBtn');
const rotPlusBtn = document.getElementById('rotPlusBtn');
const historyBtn = document.getElementById('historyBtn');
const historyPanel = document.getElementById('historyPanel');
const historyList = document.getElementById('historyList');
const closeHistory = document.getElementById('closeHistory');
const exportHistoryBtn = document.getElementById('exportHistoryBtn');
const clearHistoryBtn = document.getElementById('clearHistoryBtn');

let poseLandmarker = null;
let running = false;
let facingMode = 'environment';
let lastVideoTime = -1;
let currentStream = null;

// ---------------------------------------------------------------------
// Spin type presets. Each metric: { label, good, okay, higherIsBetter }
// primary  = the "anchor" leg's knee angle (bent for sit spin, straight for
//            camel/upright). null = not tracked for this spin type.
// secondary= free leg extension knee angle. null = not tracked.
// lean     = torso lean-from-vertical angle. direction of "good" varies
//            (upright spins want low lean, camel/layback want high lean).
// legRoleMode: 'bentKnee' (sit spin: more-bent knee = anchor leg) or
//              'ankleHeight' (others: lower ankle on screen = anchor leg)
// ---------------------------------------------------------------------
const SPIN_CONFIGS = {
  sit: {
    name: 'Sit Spin (Forward)',
    legRoleMode: 'bentKnee',
    primary:   { label: 'Sitting knee', good: 90,  okay: 120, higherIsBetter: false, dirWord: 'under' },
    secondary: { label: 'Free leg extension', good: 150, okay: 120, higherIsBetter: true,  dirWord: 'over' },
    lean:      { label: 'Torso lean from vertical', good: 20, okay: 35, higherIsBetter: false, dirWord: 'under' }
  },
  sitBack: {
    name: 'Back Sit Spin',
    legRoleMode: 'bentKnee',
    primary:   { label: 'Sitting knee', good: 90,  okay: 120, higherIsBetter: false, dirWord: 'under' },
    secondary: { label: 'Free leg extension', good: 150, okay: 120, higherIsBetter: true,  dirWord: 'over' },
    lean:      { label: 'Torso lean from vertical', good: 20, okay: 35, higherIsBetter: false, dirWord: 'under' }
  },
  sitChange: {
    name: 'Change Sit Spin (Back→Forward)',
    legRoleMode: 'bentKnee',
    primary:   { label: 'Sitting knee', good: 90,  okay: 120, higherIsBetter: false, dirWord: 'under' },
    secondary: { label: 'Free leg extension', good: 150, okay: 120, higherIsBetter: true,  dirWord: 'over' },
    lean:      { label: 'Torso lean from vertical', good: 20, okay: 35, higherIsBetter: false, dirWord: 'under' }
  },
  camel: {
    name: 'Camel Spin',
    legRoleMode: 'ankleHeight',
    primary:   { label: 'Skating knee (straight)', good: 160, okay: 140, higherIsBetter: true, dirWord: 'over' },
    secondary: { label: 'Free leg extension', good: 150, okay: 120, higherIsBetter: true, dirWord: 'over' },
    lean:      { label: 'Torso lean (horizontal)', good: 65, okay: 45, higherIsBetter: true, dirWord: 'over' }
  },
  camelBack: {
    name: 'Back Camel Spin',
    legRoleMode: 'ankleHeight',
    primary:   { label: 'Skating knee (straight)', good: 160, okay: 140, higherIsBetter: true, dirWord: 'over' },
    secondary: { label: 'Free leg extension', good: 150, okay: 120, higherIsBetter: true, dirWord: 'over' },
    lean:      { label: 'Torso lean (horizontal)', good: 65, okay: 45, higherIsBetter: true, dirWord: 'over' }
  },
  upright: {
    name: 'Upright (Scratch) Spin',
    legRoleMode: 'ankleHeight',
    primary:   { label: 'Skating knee (straight)', good: 160, okay: 140, higherIsBetter: true, dirWord: 'over' },
    secondary: null,
    lean:      { label: 'Torso lean from vertical', good: 15, okay: 30, higherIsBetter: false, dirWord: 'under' }
  },
  layback: {
    name: 'Layback Spin',
    legRoleMode: 'ankleHeight',
    primary: null,
    secondary: { label: 'Free leg extension', good: 140, okay: 110, higherIsBetter: true, dirWord: 'over' },
    lean:      { label: 'Back arch (lean)', good: 55, okay: 35, higherIsBetter: true, dirWord: 'over' }
  },
  brokenLeg: {
    name: 'Broken Leg Spin',
    legRoleMode: 'ankleHeight',
    primary:   { label: 'Skating knee (straight)', good: 160, okay: 140, higherIsBetter: true, dirWord: 'over' },
    secondary: { label: 'Free leg bend (folded)', good: 110, okay: 140, higherIsBetter: false, dirWord: 'under' },
    lean:      { label: 'Torso lean (horizontal)', good: 55, okay: 40, higherIsBetter: true, dirWord: 'over' }
  },
  bielmann: {
    name: 'Bielmann Spin',
    legRoleMode: 'ankleHeight',
    primary:   { label: 'Skating knee (straight)', good: 160, okay: 140, higherIsBetter: true, dirWord: 'over' },
    secondary: { label: 'Free leg fold (grabbed overhead)', good: 60, okay: 90, higherIsBetter: false, dirWord: 'under' },
    lean:      { label: 'Back arch (lean)', good: 75, okay: 55, higherIsBetter: true, dirWord: 'over' }
  },
  donut: {
    name: 'Donut Spin',
    legRoleMode: 'ankleHeight',
    primary:   { label: 'Skating knee (straight)', good: 160, okay: 140, higherIsBetter: true, dirWord: 'over' },
    secondary: { label: 'Free leg fold (grabbed to side)', good: 60, okay: 90, higherIsBetter: false, dirWord: 'under' },
    lean:      { label: 'Torso lean (horizontal)', good: 60, okay: 40, higherIsBetter: true, dirWord: 'over' }
  },
  combination: {
    name: 'Combination Spin (freeform)',
    legRoleMode: 'ankleHeight',
    primary: null,
    secondary: null,
    lean: null
  }
};

let currentSpinType = 'sit';
let smoothedPrimary = null, smoothedSecondary = null, smoothedLean = null;
const ANGLE_SMOOTHING_ALPHA = 0.35;
function resetAngleSmoothing() { smoothedPrimary = null; smoothedSecondary = null; smoothedLean = null; }

// live (possibly user-adjusted) copy of thresholds per spin type
const liveConfigs = JSON.parse(JSON.stringify(SPIN_CONFIGS));

function populateSpinTypeSelect() {
  Object.keys(SPIN_CONFIGS).forEach(key => {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = SPIN_CONFIGS[key].name;
    spinTypeSelect.appendChild(opt);
  });
  spinTypeSelect.value = currentSpinType;
}
populateSpinTypeSelect();

function buildSliderRow(metricKey, metric, groupLabel) {
  const wrap = document.createElement('div');
  wrap.className = 'metricGroup';
  wrap.dataset.metric = metricKey;

  const goodLabel = document.createElement('label');
  goodLabel.innerHTML = `${metric.label} — good if ${metric.dirWord} <span class="val" id="${metricKey}GoodVal">${metric.good}</span>°`;
  const goodRow = document.createElement('div');
  goodRow.className = 'rangeRow';
  const goodInput = document.createElement('input');
  goodInput.type = 'range'; goodInput.min = 0; goodInput.max = 180; goodInput.value = metric.good;
  goodInput.id = metricKey + 'Good';
  goodRow.appendChild(goodInput);

  const okayLabel = document.createElement('label');
  okayLabel.innerHTML = `${metric.label} — okay if ${metric.dirWord} <span class="val" id="${metricKey}OkayVal">${metric.okay}</span>°`;
  const okayRow = document.createElement('div');
  okayRow.className = 'rangeRow';
  const okayInput = document.createElement('input');
  okayInput.type = 'range'; okayInput.min = 0; okayInput.max = 180; okayInput.value = metric.okay;
  okayInput.id = metricKey + 'Okay';
  okayRow.appendChild(okayInput);

  wrap.appendChild(goodLabel); wrap.appendChild(goodRow);
  wrap.appendChild(okayLabel); wrap.appendChild(okayRow);

  goodInput.addEventListener('input', () => {
    liveConfigs[currentSpinType][metricKey].good = Number(goodInput.value);
    document.getElementById(metricKey + 'GoodVal').textContent = goodInput.value;
  });
  okayInput.addEventListener('input', () => {
    liveConfigs[currentSpinType][metricKey].okay = Number(okayInput.value);
    document.getElementById(metricKey + 'OkayVal').textContent = okayInput.value;
  });

  return wrap;
}

function renderSliders() {
  metricSlidersEl.innerHTML = '';
  const cfg = liveConfigs[currentSpinType];
  ['primary', 'secondary', 'lean'].forEach(key => {
    if (cfg[key]) {
      metricSlidersEl.appendChild(buildSliderRow(key, cfg[key]));
    }
  });
}
renderSliders();

spinTypeSelect.addEventListener('change', () => {
  currentSpinType = spinTypeSelect.value;
  renderSliders();
  resetAngleSmoothing();
});

settingsBtn.addEventListener('click', () => settingsPanel.classList.add('open'));
closeSettings.addEventListener('click', () => settingsPanel.classList.remove('open'));
closeSummary.addEventListener('click', () => summaryPanel.classList.remove('open'));

const LM = {
  L_SHOULDER: 11, R_SHOULDER: 12,
  L_HIP: 23, R_HIP: 24,
  L_KNEE: 25, R_KNEE: 26,
  L_ANKLE: 27, R_ANKLE: 28
};

function angleBetween(a, b, c) {
  const v1 = { x: a.x - b.x, y: a.y - b.y };
  const v2 = { x: c.x - b.x, y: c.y - b.y };
  const dot = v1.x * v2.x + v1.y * v2.y;
  const mag1 = Math.hypot(v1.x, v1.y);
  const mag2 = Math.hypot(v2.x, v2.y);
  if (mag1 === 0 || mag2 === 0) return null;
  let cos = dot / (mag1 * mag2);
  cos = Math.max(-1, Math.min(1, cos));
  return Math.acos(cos) * (180 / Math.PI);
}

function torsoLeanAngle(shoulderMid, hipMid) {
  const dx = shoulderMid.x - hipMid.x;
  const dy = shoulderMid.y - hipMid.y;
  return Math.atan2(Math.abs(dx), Math.abs(dy)) * (180 / Math.PI);
}

const VISIBILITY_THRESHOLD = 0.5;
function isVisible(lm) {
  // Some landmarks may not report visibility at all - treat those as visible
  // rather than silently hiding stats the model didn't actually flag as unsure.
  return lm && (lm.visibility === undefined || lm.visibility >= VISIBILITY_THRESHOLD);
}

function checkFraming(landmarksPx, canvasW, canvasH) {
  const margin = 0.04; // 4% edge margin
  const xs = landmarksPx.map(l => l.x);
  const ys = landmarksPx.map(l => l.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const bodyHeight = maxY - minY;

  if (minX < canvasW * margin || maxX > canvasW * (1 - margin) ||
      minY < canvasH * margin || maxY > canvasH * (1 - margin)) {
    return 'Body near frame edge — step back or recenter';
  }
  if (bodyHeight < canvasH * 0.35) {
    return 'Skater is small in frame — move camera closer';
  }
  return null;
}

function classify(value, metric) {
  if (!metric) return 'neutral';
  const { good, okay, higherIsBetter } = metric;
  if (higherIsBetter) {
    if (value >= good) return 'good';
    if (value >= okay) return 'okay';
    return 'bad';
  } else {
    if (value <= good) return 'good';
    if (value <= okay) return 'okay';
    return 'bad';
  }
}

function determineLegRoles(lHip, rHip, lKnee, rKnee, lAnkle, rAnkle, mode) {
  const leftKneeAngle = angleBetween(lHip, lKnee, lAnkle);
  const rightKneeAngle = angleBetween(rHip, rKnee, rAnkle);
  if (leftKneeAngle === null || rightKneeAngle === null) return null;

  let primarySide, primaryAngle, secondarySide, secondaryAngle;
  if (mode === 'bentKnee') {
    if (leftKneeAngle <= rightKneeAngle) {
      primarySide = 'Left'; primaryAngle = leftKneeAngle;
      secondarySide = 'Right'; secondaryAngle = rightKneeAngle;
    } else {
      primarySide = 'Right'; primaryAngle = rightKneeAngle;
      secondarySide = 'Left'; secondaryAngle = leftKneeAngle;
    }
  } else {
    // ankleHeight: lower on screen (larger y) = closer to ice = skating leg
    if (lAnkle.y >= rAnkle.y) {
      primarySide = 'Left'; primaryAngle = leftKneeAngle;
      secondarySide = 'Right'; secondaryAngle = rightKneeAngle;
    } else {
      primarySide = 'Right'; primaryAngle = rightKneeAngle;
      secondarySide = 'Left'; secondaryAngle = leftKneeAngle;
    }
  }
  return { primarySide, primaryAngle, secondarySide, secondaryAngle };
}

// ---- Audio cue ----
let audioCtx = null;
let lastBeepTime = 0;
function beep() {
  const now = performance.now();
  if (now - lastBeepTime < 1500) return;
  lastBeepTime = now;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.value = 0.15;
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
    osc.stop(audioCtx.currentTime + 0.2);
  } catch (e) { /* ignore */ }
}

// ---- Hip trail (centering visualization) ----
const hipTrail = [];
const TRAIL_MAX = 40;

// ---------------------------------------------------------------------
// Spin rate + rotation counting + auto start/stop
// ---------------------------------------------------------------------
const spinSamples = []; // {t, ratio, smoothed}
const spinPeakTimes = [];
let currentRPM = null;
let lastPeriodMsEstimate = 800;
let smoothedRatio = null;
const SMOOTHING_ALPHA = 0.45; // exponential smoothing factor - higher = less smoothing

let activeSession = null; // { mode: 'manual'|'auto', startTime, deepest, rpms:[], rotationHalfCount }
let recording = false;    // manual toggle state
let autoStopTimeout = null;

function startSession(mode) {
  activeSession = { mode, startTime: performance.now(), deepest: null, rpms: [], rotationHalfCount: 0 };
  if (mode === 'auto') statusEl.textContent = 'Spin detected — tracking...';
}

function endSession() {
  if (!activeSession) return;
  showSummary(activeSession);
  activeSession = null;
  if (autoStopTimeout) { clearTimeout(autoStopTimeout); autoStopTimeout = null; }
  statusEl.textContent = 'Live — analyzing pose';
}

function showSummary(session) {
  const cfg = liveConfigs[currentSpinType];
  const durationSec = ((performance.now() - session.startTime) / 1000).toFixed(1);
  const rotations = Math.floor(session.rotationHalfCount / 2);
  document.getElementById('sumTitle').textContent = SPIN_CONFIGS[currentSpinType].name + ' summary';
  document.getElementById('sumRotations').textContent = rotations;

  const primaryLabelEl = document.getElementById('sumPrimaryLabel');
  const primaryValEl = document.getElementById('sumDeepest');
  let primaryLabelText = 'Best angle';
  let primaryValText = '--';
  if (cfg.primary) {
    primaryLabelText = 'Best ' + cfg.primary.label.toLowerCase();
    primaryValText = session.deepest !== null ? session.deepest.toFixed(0) + '°' : '--';
  }
  primaryLabelEl.textContent = primaryLabelText;
  primaryValEl.textContent = primaryValText;

  const avgRPM = session.rpms.length ? (session.rpms.reduce((s, v) => s + v, 0) / session.rpms.length) : null;
  const avgRPMText = avgRPM ? avgRPM.toFixed(1) + ' rev/s' : '--';
  document.getElementById('sumSpin').textContent = avgRPMText;
  document.getElementById('sumDuration').textContent = durationSec + 's';
  summaryPanel.classList.add('open');

  // Only log sessions with at least one full rotation - avoids cluttering
  // history with accidental taps or false-positive auto-detects.
  if (rotations >= 1) {
    saveHistoryEntry({
      timestamp: Date.now(),
      spinType: SPIN_CONFIGS[currentSpinType].name,
      mode: session.mode,
      rotations,
      primaryLabel: primaryLabelText,
      primaryValue: primaryValText,
      avgRPM: avgRPMText,
      durationSec
    });
  }
}

// ---------------------------------------------------------------------
// Session history (persisted via localStorage - this is a normal hosted
// webpage the coach owns, not a sandboxed embed, so this is safe to use
// and gives history across sessions/days without any backend.)
// ---------------------------------------------------------------------
const HISTORY_KEY = 'spinAnalyzerHistory';
const HISTORY_MAX = 50;

function loadHistory() {
  try {
    return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
  } catch (e) { return []; }
}

function saveHistoryEntry(entry) {
  const history = loadHistory();
  history.unshift(entry);
  while (history.length > HISTORY_MAX) history.pop();
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch (e) { /* storage full/unavailable */ }
  renderHistory();
}

function renderHistory() {
  const history = loadHistory();
  historyList.innerHTML = '';
  if (history.length === 0) {
    historyList.innerHTML = '<div id="emptyHistoryMsg">No sessions recorded yet.</div>';
    return;
  }
  history.forEach(h => {
    const div = document.createElement('div');
    div.className = 'historyRow';
    const date = new Date(h.timestamp);
    const timeStr = date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    div.innerHTML = `
      <div class="hTitle">${h.spinType} — ${h.rotations} rev</div>
      <div class="hMeta">${h.primaryLabel}: ${h.primaryValue} · ${h.avgRPM} · ${h.durationSec}s</div>
      <div class="hMeta">${timeStr} (${h.mode})</div>
    `;
    historyList.appendChild(div);
  });
}

function historyToText() {
  const history = loadHistory();
  if (history.length === 0) return 'No sessions recorded yet.';
  return history.map(h => {
    const date = new Date(h.timestamp);
    return `${date.toLocaleDateString()} ${date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} — ${h.spinType}: ${h.rotations} rev, ${h.primaryLabel} ${h.primaryValue}, ${h.avgRPM}, ${h.durationSec}s (${h.mode})`;
  }).join('\n');
}

historyBtn.addEventListener('click', () => { renderHistory(); historyPanel.classList.add('open'); });
closeHistory.addEventListener('click', () => historyPanel.classList.remove('open'));
clearHistoryBtn.addEventListener('click', () => {
  if (confirm('Clear all saved session history? This cannot be undone.')) {
    localStorage.removeItem(HISTORY_KEY);
    renderHistory();
  }
});
exportHistoryBtn.addEventListener('click', async () => {
  const text = historyToText();
  if (navigator.share) {
    try { await navigator.share({ title: 'Spin session history', text }); return; } catch (e) { /* user cancelled or unsupported, fall through */ }
  }
  try {
    await navigator.clipboard.writeText(text);
    alert('Copied session history to clipboard.');
  } catch (e) {
    alert('Could not copy automatically. Long-press to select and copy the text below:\n\n' + text);
  }
});

function updateSpinRate(shoulderWidth, torsoLen, now) {
  if (torsoLen <= 0) return;
  const rawRatio = shoulderWidth / torsoLen;

  // Exponential smoothing knocks out single-frame pose jitter so it doesn't
  // get mistaken for a real oscillation peak.
  smoothedRatio = (smoothedRatio === null) ? rawRatio : (SMOOTHING_ALPHA * rawRatio + (1 - SMOOTHING_ALPHA) * smoothedRatio);

  spinSamples.push({ t: now, ratio: smoothedRatio });
  const cutoff = now - 4000;
  while (spinSamples.length && spinSamples[0].t < cutoff) spinSamples.shift();

  if (spinSamples.length < 5) return;
  const i = spinSamples.length - 3;
  const a = spinSamples[i - 1], b = spinSamples[i], c = spinSamples[i + 1];
  if (!a || !b || !c) return;
  const isPeak = b.ratio > a.ratio && b.ratio > c.ratio && b.ratio > 0.25;

  if (isPeak) {
    const lastPeak = spinPeakTimes[spinPeakTimes.length - 1];
    // Refractory period scales with the observed spin speed: fast spins need
    // a short minimum gap so real peaks aren't missed; slow/idle motion needs
    // a longer gap so noise doesn't get double-counted as rotations.
    const adaptiveRefractoryMs = Math.max(120, Math.min(400, lastPeriodMsEstimate * 0.35));
    if (!lastPeak || (b.t - lastPeak) > adaptiveRefractoryMs) {
      spinPeakTimes.push(b.t);
      if (spinPeakTimes.length > 10) spinPeakTimes.shift();

      // --- auto start/stop + rotation counting ---
      if (!recording && autoDetectToggle.checked) {
        if (!activeSession) startSession('auto');
      }
      if (activeSession) activeSession.rotationHalfCount++;

      if (!recording && autoDetectToggle.checked) {
        if (autoStopTimeout) clearTimeout(autoStopTimeout);
        // Generous timeout so a brief hitch (e.g. a foot change mid-spin)
        // doesn't prematurely end the session and cut off the count.
        const timeoutMs = Math.max(1800, lastPeriodMsEstimate * 2.5);
        autoStopTimeout = setTimeout(() => {
          if (activeSession && activeSession.mode === 'auto') endSession();
        }, timeoutMs);
      }
    }
  }

  if (spinPeakTimes.length >= 3) {
    const intervals = [];
    for (let k = 1; k < spinPeakTimes.length; k++) intervals.push(spinPeakTimes[k] - spinPeakTimes[k - 1]);
    // Median is more robust than mean against one stray/jittery interval.
    intervals.sort((x, y) => x - y);
    const medianIntervalMs = intervals[Math.floor(intervals.length / 2)];
    const periodMs = medianIntervalMs * 2;
    lastPeriodMsEstimate = periodMs;
    currentRPM = 60000 / periodMs;
  }
}

function adjustRotationCount(delta) {
  if (!activeSession) return;
  activeSession.rotationHalfCount = Math.max(0, activeSession.rotationHalfCount + delta * 2);
}

recordBtn.addEventListener('click', () => {
  if (!recording) {
    recording = true;
    if (autoStopTimeout) { clearTimeout(autoStopTimeout); autoStopTimeout = null; }
    if (activeSession && activeSession.mode === 'auto') activeSession = null; // discard stray auto session
    startSession('manual');
    recordBtn.textContent = '■ Stop';
    recordBtn.classList.add('recording');
  } else {
    recording = false;
    recordBtn.textContent = '● Manual rec';
    recordBtn.classList.remove('recording');
    endSession();
  }
});

rotMinusBtn.addEventListener('click', () => adjustRotationCount(-1));
rotPlusBtn.addEventListener('click', () => adjustRotationCount(1));

// ---- Setup ----
async function setupPoseLandmarker() {
  statusEl.textContent = "Loading pose model...";
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numPoses: 1
  });
  statusEl.textContent = "Model loaded. Point camera at skater.";
}

async function startCamera(mode) {
  // Fully release the old stream and detach it from the video element before
  // requesting a new one - iOS Safari can otherwise get confused about which
  // physical camera is "in use" and silently keep the old one.
  if (currentStream) {
    currentStream.getTracks().forEach(t => t.stop());
    currentStream = null;
  }
  video.pause();
  video.srcObject = null;

  async function requestStream(constraintMode, exact) {
    const videoConstraint = exact
      ? { facingMode: { exact: constraintMode }, width: { ideal: 1280 }, height: { ideal: 720 } }
      : { facingMode: { ideal: constraintMode }, width: { ideal: 1280 }, height: { ideal: 720 } };
    return navigator.mediaDevices.getUserMedia({ video: videoConstraint, audio: false });
  }

  let stream;
  try {
    // Try to force the exact camera first so a switch actually happens.
    stream = await requestStream(mode, true);
  } catch (err) {
    // Device doesn't have that exact camera (e.g. no front camera) - fall
    // back to a best-effort request rather than leaving the camera off.
    stream = await requestStream(mode, false);
  }

  currentStream = stream;
  video.srcObject = stream;

  await new Promise((resolve) => {
    if (video.readyState >= 2 && video.videoWidth > 0) resolve();
    else video.onloadedmetadata = () => resolve();
  });

  await video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
}

// MediaPipe's 33-point pose includes face landmarks (indices 0-10). We only
// care about body posture, so those are filtered out of drawing entirely.
const FACE_LANDMARK_CUTOFF = 11;
const BODY_CONNECTIONS = PoseLandmarker.POSE_CONNECTIONS.filter(
  (c) => c.start >= FACE_LANDMARK_CUTOFF && c.end >= FACE_LANDMARK_CUTOFF
);

function drawSkeleton(landmarks, overallQuality) {
  const drawingUtils = new DrawingUtils(ctx);
  const colorMap = { good: '#2ecc71', okay: '#f1c40f', bad: '#e74c3c' };
  const color = colorMap[overallQuality] || '#00E0FF';

  const bodyLandmarks = landmarks.map((lm, i) =>
    i < FACE_LANDMARK_CUTOFF ? { x: -1, y: -1, z: 0, visibility: 0 } : lm
  );

  drawingUtils.drawLandmarks(bodyLandmarks, { radius: 4, color: '#ffffff' });
  drawingUtils.drawConnectors(landmarks, BODY_CONNECTIONS, { color, lineWidth: 3 });
}

function drawHipTrail() {
  if (hipTrail.length < 2) return;
  ctx.save();
  for (let i = 1; i < hipTrail.length; i++) {
    const p0 = hipTrail[i - 1], p1 = hipTrail[i];
    const alpha = i / hipTrail.length;
    ctx.strokeStyle = `rgba(0, 224, 255, ${alpha * 0.7})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.stroke();
  }
  ctx.restore();
}

function updateStats(landmarksPx, now) {
  overlay.innerHTML = '';
  const cfg = liveConfigs[currentSpinType];

  const lHip = landmarksPx[LM.L_HIP], rHip = landmarksPx[LM.R_HIP];
  const lKnee = landmarksPx[LM.L_KNEE], rKnee = landmarksPx[LM.R_KNEE];
  const lAnkle = landmarksPx[LM.L_ANKLE], rAnkle = landmarksPx[LM.R_ANKLE];
  const lShoulder = landmarksPx[LM.L_SHOULDER], rShoulder = landmarksPx[LM.R_SHOULDER];

  // Framing feedback takes priority over spin status messages so the coach
  // knows immediately when a reading can't be trusted due to positioning.
  const framingWarning = checkFraming(landmarksPx, canvas.width, canvas.height);
  if (framingWarning) {
    statusEl.textContent = framingWarning;
  } else if (!activeSession) {
    statusEl.textContent = 'Live — analyzing pose';
  }

  const legsVisible = [lHip, rHip, lKnee, rKnee, lAnkle, rAnkle].every(isVisible);
  const torsoVisible = [lShoulder, rShoulder, lHip, rHip].every(isVisible);

  const roles = legsVisible
    ? determineLegRoles(lHip, rHip, lKnee, rKnee, lAnkle, rAnkle, SPIN_CONFIGS[currentSpinType].legRoleMode)
    : null;

  const hipMid = { x: (lHip.x + rHip.x) / 2, y: (lHip.y + rHip.y) / 2 };
  const shoulderMid = { x: (lShoulder.x + rShoulder.x) / 2, y: (lShoulder.y + rShoulder.y) / 2 };
  const rawLeanAngle = torsoVisible ? torsoLeanAngle(shoulderMid, hipMid) : null;

  const shoulderWidth = Math.hypot(rShoulder.x - lShoulder.x, rShoulder.y - lShoulder.y);
  const torsoLen = Math.hypot(shoulderMid.x - hipMid.x, shoulderMid.y - hipMid.y);
  updateSpinRate(shoulderWidth, torsoLen, now);

  hipTrail.push(hipMid);
  if (hipTrail.length > TRAIL_MAX) hipTrail.shift();

  let overallQuality = 'good';
  const worsen = (q) => {
    if (q === 'bad') overallQuality = 'bad';
    else if (q === 'okay' && overallQuality !== 'bad') overallQuality = 'okay';
  };

  const stats = [];

  if (cfg.primary && roles) {
    smoothedPrimary = (smoothedPrimary === null) ? roles.primaryAngle
      : (ANGLE_SMOOTHING_ALPHA * roles.primaryAngle + (1 - ANGLE_SMOOTHING_ALPHA) * smoothedPrimary);
    const q = classify(smoothedPrimary, cfg.primary);
    worsen(q);
    stats.push({ label: `${cfg.primary.label} (${roles.primarySide})`, value: smoothedPrimary.toFixed(0) + '°', q });
    if (activeSession) {
      const better = cfg.primary.higherIsBetter
        ? (activeSession.deepest === null || smoothedPrimary > activeSession.deepest)
        : (activeSession.deepest === null || smoothedPrimary < activeSession.deepest);
      if (better) activeSession.deepest = smoothedPrimary;
      if (q === 'good') beep();
    }
  } else if (cfg.primary) {
    stats.push({ label: cfg.primary.label, value: 'Obstructed', q: 'neutral' });
  }

  if (cfg.secondary && roles) {
    smoothedSecondary = (smoothedSecondary === null) ? roles.secondaryAngle
      : (ANGLE_SMOOTHING_ALPHA * roles.secondaryAngle + (1 - ANGLE_SMOOTHING_ALPHA) * smoothedSecondary);
    const q = classify(smoothedSecondary, cfg.secondary);
    worsen(q);
    stats.push({ label: `${cfg.secondary.label} (${roles.secondarySide})`, value: smoothedSecondary.toFixed(0) + '°', q });
  } else if (cfg.secondary) {
    stats.push({ label: cfg.secondary.label, value: 'Obstructed', q: 'neutral' });
  }

  if (cfg.lean && rawLeanAngle !== null) {
    smoothedLean = (smoothedLean === null) ? rawLeanAngle
      : (ANGLE_SMOOTHING_ALPHA * rawLeanAngle + (1 - ANGLE_SMOOTHING_ALPHA) * smoothedLean);
    const q = classify(smoothedLean, cfg.lean);
    worsen(q);
    stats.push({ label: cfg.lean.label, value: smoothedLean.toFixed(0) + '°', q });
  } else if (cfg.lean) {
    stats.push({ label: cfg.lean.label, value: 'Obstructed', q: 'neutral' });
  }

  if (currentRPM !== null) {
    stats.push({ label: 'Spin rate (approx.)', value: currentRPM.toFixed(1) + ' rev/s', q: 'neutral' });
    if (activeSession) activeSession.rpms.push(currentRPM);
  }
  if (activeSession) {
    const rotations = Math.floor(activeSession.rotationHalfCount / 2);
    stats.push({ label: `Rotations (${activeSession.mode})`, value: String(rotations), q: 'neutral' });
  }

  stats.forEach(s => {
    const div = document.createElement('div');
    div.className = 'stat ' + (s.q || '');
    div.innerHTML = `<span class="label">${s.label}</span><span class="value">${s.value}</span>`;
    overlay.appendChild(div);
  });

  return overallQuality;
}

// ---- FPS tracking ----
let frameTimes = [];
function updateFps(now) {
  frameTimes.push(now);
  const cutoff = now - 1000;
  frameTimes = frameTimes.filter(t => t > cutoff);
  fpsBadge.textContent = frameTimes.length + ' fps';
}

function renderLoop() {
  if (!running) return;
  const now = performance.now();
  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const result = poseLandmarker.detectForVideo(video, now);
    ctx.save();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    if (result.landmarks && result.landmarks.length > 0) {
      const landmarks = result.landmarks[0];
      const pixelLandmarks = landmarks.map(p => ({ x: p.x * canvas.width, y: p.y * canvas.height, z: p.z, visibility: p.visibility }));
      const quality = updateStats(pixelLandmarks, now);
      drawHipTrail();
      drawSkeleton(landmarks, quality);
    } else {
      overlay.innerHTML = '<div class="stat">No person detected</div>';
    }
    ctx.restore();
    updateFps(now);
  }
  requestAnimationFrame(renderLoop);
}

startBtn.addEventListener('click', async () => {
  startBtn.style.display = 'none';
  try {
    await setupPoseLandmarker();
    await startCamera(facingMode);
    running = true;
    statusEl.textContent = "Live — analyzing pose";
    renderLoop();
  } catch (err) {
    statusEl.textContent = "Error: " + err.message;
    startBtn.style.display = 'block';
  }
});

switchBtn.addEventListener('click', async () => {
  if (!running) return;
  const newMode = facingMode === 'environment' ? 'user' : 'environment';
  switchBtn.disabled = true;
  switchBtn.textContent = 'Switching...';
  try {
    await startCamera(newMode);
    facingMode = newMode;
  } catch (err) {
    statusEl.textContent = 'Could not switch camera: ' + err.message;
  } finally {
    switchBtn.disabled = false;
    switchBtn.textContent = 'Flip';
  }
});
</script>
