<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spin Analyzer</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #container { position: relative; width: 100vw; height: 100vh; }
  video, canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  video { display: none; }

  #topBar {
    position: absolute; top: 0; left: 0; width: 100%;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 12px; z-index: 10; pointer-events: none;
  }
  #topBar > * { pointer-events: auto; }

  #overlay {
    display: flex; flex-direction: column; gap: 6px;
  }
  .stat {
    background: rgba(0,0,0,0.6);
    border-left: 4px solid #888;
    color: #fff;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    width: fit-content;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    transition: border-color 0.2s;
  }
  .stat.good { border-color: #2ecc71; }
  .stat.okay { border-color: #f1c40f; }
  .stat.bad  { border-color: #e74c3c; }
  .stat.neutral { border-color: #00E0FF; }
  .stat .label { opacity: 0.75; font-weight: 400; font-size: 11px; display: block; }
  .stat .value { font-size: 19px; }

  .iconBtn {
    background: rgba(0,0,0,0.55);
    color: #fff; border: none; border-radius: 10px;
    padding: 8px 12px; font-size: 13px; font-weight: 600;
    margin-left: 6px;
  }
  #spinTypeSelect {
    background: rgba(0,0,0,0.55);
    color: #fff; border: none; border-radius: 10px;
    padding: 8px 10px; font-size: 13px; font-weight: 600;
  }
  #rightControls { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  #rightControls .row { display: flex; }

  #status {
    position: absolute; bottom: 0; left: 0; width: 100%;
    padding: 12px; text-align: center;
    color: #fff; font-size: 13px;
    background: rgba(0,0,0,0.5);
    z-index: 10;
  }
  #startBtn {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    padding: 16px 32px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 30px;
    border: none;
    background: #ff3b30;
    color: white;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }

  #recordBtn.recording { background: #2ecc71; }

  #settingsPanel {
    position: absolute; top: 60px; right: 12px; z-index: 30;
    background: rgba(20,20,20,0.92);
    color: #fff; border-radius: 14px; padding: 16px;
    width: 250px; display: none;
    font-size: 13px; max-height: 80vh; overflow-y: auto;
  }
  #settingsPanel.open { display: block; }
  #settingsPanel h3 { margin: 0 0 10px 0; font-size: 14px; }
  #settingsPanel .metricGroup { margin-top: 12px; }
  #settingsPanel label { display: block; margin-top: 8px; opacity: 0.85; }
  #settingsPanel .rangeRow { display: flex; align-items: center; gap: 8px; }
  #settingsPanel input[type=range] { flex: 1; }
  #settingsPanel .val { width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
  #settingsPanel .closeSettings {
    margin-top: 14px; width: 100%; padding: 8px; border-radius: 8px; border: none;
    background: #444; color: #fff; font-weight: 600;
  }
  #settingsPanel .autoToggleRow {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 4px; padding: 8px 0; border-bottom: 1px solid #333;
  }

  #summaryPanel {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    z-index: 40; background: rgba(15,15,15,0.95); color: #fff;
    border-radius: 16px; padding: 22px; width: 270px; display: none;
    text-align: center;
  }
  #summaryPanel.open { display: block; }
  #summaryPanel h2 { margin: 0 0 12px 0; font-size: 17px; }
  #summaryPanel .row { display: flex; justify-content: space-between; margin: 8px 0; font-size: 14px; }
  #summaryPanel .row .v { font-weight: 700; }
  #summaryPanel button {
    margin-top: 14px; width: 100%; padding: 10px; border-radius: 10px; border: none;
    background: #ff3b30; color: #fff; font-weight: 700;
  }

  #fpsBadge {
    position: absolute; bottom: 38px; left: 12px; z-index: 10;
    background: rgba(0,0,0,0.5); color: #9be89b; font-size: 11px;
    padding: 4px 8px; border-radius: 6px; font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<div id="container">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>

  <div id="topBar">
    <div id="overlay"></div>
    <div id="rightControls">
      <div class="row">
        <select id="spinTypeSelect"></select>
      </div>
      <div class="row">
        <button class="iconBtn" id="switchBtn">Flip</button>
        <button class="iconBtn" id="settingsBtn">Settings</button>
      </div>
      <div class="row">
        <button class="iconBtn" id="recordBtn">● Manual rec</button>
      </div>
    </div>
  </div>

  <div id="fpsBadge">-- fps</div>
  <div id="status">Tap Start, then point the camera at the skater.</div>
  <button id="startBtn">Start Camera</button>

  <div id="settingsPanel">
    <h3>Spin detection</h3>
    <div class="autoToggleRow">
      <span>Auto start/stop on spin</span>
      <input type="checkbox" id="autoDetectToggle" checked>
    </div>

    <h3 style="margin-top:14px;">Target thresholds</h3>
    <div id="metricSliders"></div>

    <button class="closeSettings" id="closeSettings">Done</button>
  </div>

  <div id="summaryPanel">
    <h2 id="sumTitle">Session summary</h2>
    <div class="row"><span>Total rotations</span><span class="v" id="sumRotations">--</span></div>
    <div class="row"><span id="sumPrimaryLabel">Best angle</span><span class="v" id="sumDeepest">--</span></div>
    <div class="row"><span>Avg spin rate (approx.)</span><span class="v" id="sumSpin">--</span></div>
    <div class="row"><span>Duration</span><span class="v" id="sumDuration">--</span></div>
    <button id="closeSummary">Close</button>
  </div>
</div>

<script type="module">
import {
  PoseLandmarker,
  FilesetResolver,
  DrawingUtils
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const switchBtn = document.getElementById('switchBtn');
const settingsBtn = document.getElementById('settingsBtn');
const settingsPanel = document.getElementById('settingsPanel');
const closeSettings = document.getElementById('closeSettings');
const recordBtn = document.getElementById('recordBtn');
const summaryPanel = document.getElementById('summaryPanel');
const closeSummary = document.getElementById('closeSummary');
const fpsBadge = document.getElementById('fpsBadge');
const spinTypeSelect = document.getElementById('spinTypeSelect');
const autoDetectToggle = document.getElementById('autoDetectToggle');
const metricSlidersEl = document.getElementById('metricSliders');

let poseLandmarker = null;
let running = false;
let facingMode = 'environment';
let lastVideoTime = -1;
let currentStream = null;

// ---------------------------------------------------------------------
// Spin type presets. Each metric: { label, good, okay, higherIsBetter }
// primary  = the "anchor" leg's knee angle (bent for sit spin, straight for
//            camel/upright). null = not tracked for this spin type.
// secondary= free leg extension knee angle. null = not tracked.
// lean     = torso lean-from-vertical angle. direction of "good" varies
//            (upright spins want low lean, camel/layback want high lean).
// legRoleMode: 'bentKnee' (sit spin: more-bent knee = anchor leg) or
//              'ankleHeight' (others: lower ankle on screen = anchor leg)
// ---------------------------------------------------------------------
const SPIN_CONFIGS = {
  sit: {
    name: 'Sit Spin',
    legRoleMode: 'bentKnee',
    primary:   { label: 'Sitting knee',179: null, good: 90,  okay: 120, higherIsBetter: false, dirWord: 'under' },
    secondary: { label: 'Free leg extension', good: 150, okay: 120, higherIsBetter: true,  dirWord: 'over' },
    lean:      { label: 'Torso lean from vertical', good: 20, okay: 35, higherIsBetter: false, dirWord: 'under' }
  },
  camel: {
    name: 'Camel Spin',
    legRoleMode: 'ankleHeight',
    primary:   { label: 'Skating knee (straight)', good: 160, okay: 140, higherIsBetter: true, dirWord: 'over' },
    secondary: { label: 'Free leg extension', good: 150, okay: 120, higherIsBetter: true, dirWord: 'over' },
    lean:      { label: 'Torso lean (horizontal)', good: 65, okay: 45, higherIsBetter: true, dirWord: 'over' }
  },
  upright: {
    name: 'Upright (Scratch) Spin',
    legRoleMode: 'ankleHeight',
    primary:   { label: 'Skating knee (straight)', good: 160, okay: 140, higherIsBetter: true, dirWord: 'over' },
    secondary: null,
    lean:      { label: 'Torso lean from vertical', good: 15, okay: 30, higherIsBetter: false, dirWord: 'under' }
  },
  layback: {
    name: 'Layback Spin',
    legRoleMode: 'ankleHeight',
    primary: null,
    secondary: { label: 'Free leg extension', good: 140, okay: 110, higherIsBetter: true, dirWord: 'over' },
    lean:      { label: 'Back arch (lean)', good: 55, okay: 35, higherIsBetter: true, dirWord: 'over' }
  }
};

let currentSpinType = 'sit';

// live (possibly user-adjusted) copy of thresholds per spin type
const liveConfigs = JSON.parse(JSON.stringify(SPIN_CONFIGS));

function populateSpinTypeSelect() {
  Object.keys(SPIN_CONFIGS).forEach(key => {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = SPIN_CONFIGS[key].name;
    spinTypeSelect.appendChild(opt);
  });
  spinTypeSelect.value = currentSpinType;
}
populateSpinTypeSelect();

function buildSliderRow(metricKey, metric, groupLabel) {
  const wrap = document.createElement('div');
  wrap.className = 'metricGroup';
  wrap.dataset.metric = metricKey;

  const goodLabel = document.createElement('label');
  goodLabel.innerHTML = `${metric.label} — good if ${metric.dirWord} <span class="val" id="${metricKey}GoodVal">${metric.good}</span>°`;
  const goodRow = document.createElement('div');
  goodRow.className = 'rangeRow';
  const goodInput = document.createElement('input');
  goodInput.type = 'range'; goodInput.min = 0; goodInput.max = 180; goodInput.value = metric.good;
  goodInput.id = metricKey + 'Good';
  goodRow.appendChild(goodInput);

  const okayLabel = document.createElement('label');
  okayLabel.innerHTML = `${metric.label} — okay if ${metric.dirWord} <span class="val" id="${metricKey}OkayVal">${metric.okay}</span>°`;
  const okayRow = document.createElement('div');
  okayRow.className = 'rangeRow';
  const okayInput = document.createElement('input');
  okayInput.type = 'range'; okayInput.min = 0; okayInput.max = 180; okayInput.value = metric.okay;
  okayInput.id = metricKey + 'Okay';
  okayRow.appendChild(okayInput);

  wrap.appendChild(goodLabel); wrap.appendChild(goodRow);
  wrap.appendChild(okayLabel); wrap.appendChild(okayRow);

  goodInput.addEventListener('input', () => {
    liveConfigs[currentSpinType][metricKey].good = Number(goodInput.value);
    document.getElementById(metricKey + 'GoodVal').textContent = goodInput.value;
  });
  okayInput.addEventListener('input', () => {
    liveConfigs[currentSpinType][metricKey].okay = Number(okayInput.value);
    document.getElementById(metricKey + 'OkayVal').textContent = okayInput.value;
  });

  return wrap;
}

function renderSliders() {
  metricSlidersEl.innerHTML = '';
  const cfg = liveConfigs[currentSpinType];
  ['primary', 'secondary', 'lean'].forEach(key => {
    if (cfg[key]) {
      metricSlidersEl.appendChild(buildSliderRow(key, cfg[key]));
    }
  });
}
renderSliders();

spinTypeSelect.addEventListener('change', () => {
  currentSpinType = spinTypeSelect.value;
  renderSliders();
});

settingsBtn.addEventListener('click', () => settingsPanel.classList.add('open'));
closeSettings.addEventListener('click', () => settingsPanel.classList.remove('open'));
closeSummary.addEventListener('click', () => summaryPanel.classList.remove('open'));

const LM = {
  L_SHOULDER: 11, R_SHOULDER: 12,
  L_HIP: 23, R_HIP: 24,
  L_KNEE: 25, R_KNEE: 26,
  L_ANKLE: 27, R_ANKLE: 28
};

function angleBetween(a, b, c) {
  const v1 = { x: a.x - b.x, y: a.y - b.y };
  const v2 = { x: c.x - b.x, y: c.y - b.y };
  const dot = v1.x * v2.x + v1.y * v2.y;
  const mag1 = Math.hypot(v1.x, v1.y);
  const mag2 = Math.hypot(v2.x, v2.y);
  if (mag1 === 0 || mag2 === 0) return null;
  let cos = dot / (mag1 * mag2);
  cos = Math.max(-1, Math.min(1, cos));
  return Math.acos(cos) * (180 / Math.PI);
}

function torsoLeanAngle(shoulderMid, hipMid) {
  const dx = shoulderMid.x - hipMid.x;
  const dy = shoulderMid.y - hipMid.y;
  return Math.atan2(Math.abs(dx), Math.abs(dy)) * (180 / Math.PI);
}

function classify(value, metric) {
  if (!metric) return 'neutral';
  const { good, okay, higherIsBetter } = metric;
  if (higherIsBetter) {
    if (value >= good) return 'good';
    if (value >= okay) return 'okay';
    return 'bad';
  } else {
    if (value <= good) return 'good';
    if (value <= okay) return 'okay';
    return 'bad';
  }
}

function determineLegRoles(lHip, rHip, lKnee, rKnee, lAnkle, rAnkle, mode) {
  const leftKneeAngle = angleBetween(lHip, lKnee, lAnkle);
  const rightKneeAngle = angleBetween(rHip, rKnee, rAnkle);
  if (leftKneeAngle === null || rightKneeAngle === null) return null;

  let primarySide, primaryAngle, secondarySide, secondaryAngle;
  if (mode === 'bentKnee') {
    if (leftKneeAngle <= rightKneeAngle) {
      primarySide = 'Left'; primaryAngle = leftKneeAngle;
      secondarySide = 'Right'; secondaryAngle = rightKneeAngle;
    } else {
      primarySide = 'Right'; primaryAngle = rightKneeAngle;
      secondarySide = 'Left'; secondaryAngle = leftKneeAngle;
    }
  } else {
    // ankleHeight: lower on screen (larger y) = closer to ice = skating leg
    if (lAnkle.y >= rAnkle.y) {
      primarySide = 'Left'; primaryAngle = leftKneeAngle;
      secondarySide = 'Right'; secondaryAngle = rightKneeAngle;
    } else {
      primarySide = 'Right'; primaryAngle = rightKneeAngle;
      secondarySide = 'Left'; secondaryAngle = leftKneeAngle;
    }
  }
  return { primarySide, primaryAngle, secondarySide, secondaryAngle };
}

// ---- Audio cue ----
let audioCtx = null;
let lastBeepTime = 0;
function beep() {
  const now = performance.now();
  if (now - lastBeepTime < 1500) return;
  lastBeepTime = now;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.value = 0.15;
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
    osc.stop(audioCtx.currentTime + 0.2);
  } catch (e) { /* ignore */ }
}

// ---- Hip trail (centering visualization) ----
const hipTrail = [];
const TRAIL_MAX = 40;

// ---------------------------------------------------------------------
// Spin rate + rotation counting + auto start/stop
// ---------------------------------------------------------------------
const spinSamples = []; // {t, ratio}
const spinPeakTimes = [];
let currentRPM = null;
let lastPeriodMsEstimate = 800;

let activeSession = null; // { mode: 'manual'|'auto', startTime, deepest, rpms:[], rotationHalfCount }
let recording = false;    // manual toggle state
let autoStopTimeout = null;

function startSession(mode) {
  activeSession = { mode, startTime: performance.now(), deepest: null, rpms: [], rotationHalfCount: 0 };
  if (mode === 'auto') statusEl.textContent = 'Spin detected — tracking...';
}

function endSession() {
  if (!activeSession) return;
  showSummary(activeSession);
  activeSession = null;
  if (autoStopTimeout) { clearTimeout(autoStopTimeout); autoStopTimeout = null; }
  statusEl.textContent = 'Live — analyzing pose';
}

function showSummary(session) {
  const cfg = liveConfigs[currentSpinType];
  const durationSec = ((performance.now() - session.startTime) / 1000).toFixed(1);
  const rotations = Math.floor(session.rotationHalfCount / 2);
  document.getElementById('sumTitle').textContent = SPIN_CONFIGS[currentSpinType].name + ' summary';
  document.getElementById('sumRotations').textContent = rotations;

  const primaryLabelEl = document.getElementById('sumPrimaryLabel');
  const primaryValEl = document.getElementById('sumDeepest');
  if (cfg.primary) {
    primaryLabelEl.textContent = 'Best ' + cfg.primary.label.toLowerCase();
    primaryValEl.textContent = session.deepest !== null ? session.deepest.toFixed(0) + '°' : '--';
  } else {
    primaryLabelEl.textContent = 'Best angle';
    primaryValEl.textContent = '--';
  }

  const avgRPM = session.rpms.length ? (session.rpms.reduce((s, v) => s + v, 0) / session.rpms.length) : null;
  document.getElementById('sumSpin').textContent = avgRPM ? avgRPM.toFixed(1) + ' rev/s' : '--';
  document.getElementById('sumDuration').textContent = durationSec + 's';
  summaryPanel.classList.add('open');
}

function updateSpinRate(shoulderWidth, torsoLen, now) {
  if (torsoLen <= 0) return;
  const ratio = shoulderWidth / torsoLen;
  spinSamples.push({ t: now, ratio });
  const cutoff = now - 4000;
  while (spinSamples.length && spinSamples[0].t < cutoff) spinSamples.shift();

  if (spinSamples.length < 5) return;
  const i = spinSamples.length - 3;
  const a = spinSamples[i - 1], b = spinSamples[i], c = spinSamples[i + 1];
  if (!a || !b || !c) return;
  const isPeak = b.ratio > a.ratio && b.ratio > c.ratio && b.ratio > 0.25;

  if (isPeak) {
    const lastPeak = spinPeakTimes[spinPeakTimes.length - 1];
    if (!lastPeak || (b.t - lastPeak) > 150) {
      spinPeakTimes.push(b.t);
      if (spinPeakTimes.length > 8) spinPeakTimes.shift();

      // --- auto start/stop + rotation counting ---
      if (!recording && autoDetectToggle.checked) {
        if (!activeSession) startSession('auto');
      }
      if (activeSession) activeSession.rotationHalfCount++;

      if (!recording && autoDetectToggle.checked) {
        if (autoStopTimeout) clearTimeout(autoStopTimeout);
        const timeoutMs = Math.max(900, lastPeriodMsEstimate * 1.8);
        autoStopTimeout = setTimeout(() => {
          if (activeSession && activeSession.mode === 'auto') endSession();
        }, timeoutMs);
      }
    }
  }

  if (spinPeakTimes.length >= 3) {
    const intervals = [];
    for (let k = 1; k < spinPeakTimes.length; k++) intervals.push(spinPeakTimes[k] - spinPeakTimes[k - 1]);
    const avgIntervalMs = intervals.reduce((s, v) => s + v, 0) / intervals.length;
    const periodMs = avgIntervalMs * 2;
    lastPeriodMsEstimate = periodMs;
    currentRPM = 60000 / periodMs;
  }
}

recordBtn.addEventListener('click', () => {
  if (!recording) {
    recording = true;
    if (autoStopTimeout) { clearTimeout(autoStopTimeout); autoStopTimeout = null; }
    if (activeSession && activeSession.mode === 'auto') activeSession = null; // discard stray auto session
    startSession('manual');
    recordBtn.textContent = '■ Stop';
    recordBtn.classList.add('recording');
  } else {
    recording = false;
    recordBtn.textContent = '● Manual rec';
    recordBtn.classList.remove('recording');
    endSession();
  }
});

// ---- Setup ----
async function setupPoseLandmarker() {
  statusEl.textContent = "Loading pose model...";
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numPoses: 1
  });
  statusEl.textContent = "Model loaded. Point camera at skater.";
}

async function startCamera() {
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());
  const constraints = {
    video: { facingMode: { ideal: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  };
  currentStream = await navigator.mediaDevices.getUserMedia(constraints);
  video.srcObject = currentStream;

  await new Promise((resolve) => {
    if (video.readyState >= 2 && video.videoWidth > 0) resolve();
    else video.onloadedmetadata = () => resolve();
  });

  await video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
}

// MediaPipe's 33-point pose includes face landmarks (indices 0-10). We only
// care about body posture, so those are filtered out of drawing entirely.
const FACE_LANDMARK_CUTOFF = 11;
const BODY_CONNECTIONS = PoseLandmarker.POSE_CONNECTIONS.filter(
  (c) => c.start >= FACE_LANDMARK_CUTOFF && c.end >= FACE_LANDMARK_CUTOFF
);

function drawSkeleton(landmarks, overallQuality) {
  const drawingUtils = new DrawingUtils(ctx);
  const colorMap = { good: '#2ecc71', okay: '#f1c40f', bad: '#e74c3c' };
  const color = colorMap[overallQuality] || '#00E0FF';

  const bodyLandmarks = landmarks.map((lm, i) =>
    i < FACE_LANDMARK_CUTOFF ? { x: -1, y: -1, z: 0, visibility: 0 } : lm
  );

  drawingUtils.drawLandmarks(bodyLandmarks, { radius: 4, color: '#ffffff' });
  drawingUtils.drawConnectors(landmarks, BODY_CONNECTIONS, { color, lineWidth: 3 });
}

function drawHipTrail() {
  if (hipTrail.length < 2) return;
  ctx.save();
  for (let i = 1; i < hipTrail.length; i++) {
    const p0 = hipTrail[i - 1], p1 = hipTrail[i];
    const alpha = i / hipTrail.length;
    ctx.strokeStyle = `rgba(0, 224, 255, ${alpha * 0.7})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.stroke();
  }
  ctx.restore();
}

function updateStats(landmarksPx, now) {
  overlay.innerHTML = '';
  const cfg = liveConfigs[currentSpinType];

  const lHip = landmarksPx[LM.L_HIP], rHip = landmarksPx[LM.R_HIP];
  const lKnee = landmarksPx[LM.L_KNEE], rKnee = landmarksPx[LM.R_KNEE];
  const lAnkle = landmarksPx[LM.L_ANKLE], rAnkle = landmarksPx[LM.R_ANKLE];
  const lShoulder = landmarksPx[LM.L_SHOULDER], rShoulder = landmarksPx[LM.R_SHOULDER];

  const roles = determineLegRoles(lHip, rHip, lKnee, rKnee, lAnkle, rAnkle, SPIN_CONFIGS[currentSpinType].legRoleMode);

  const hipMid = { x: (lHip.x + rHip.x) / 2, y: (lHip.y + rHip.y) / 2 };
  const shoulderMid = { x: (lShoulder.x + rShoulder.x) / 2, y: (lShoulder.y + rShoulder.y) / 2 };
  const leanAngle = torsoLeanAngle(shoulderMid, hipMid);

  const shoulderWidth = Math.hypot(rShoulder.x - lShoulder.x, rShoulder.y - lShoulder.y);
  const torsoLen = Math.hypot(shoulderMid.x - hipMid.x, shoulderMid.y - hipMid.y);
  updateSpinRate(shoulderWidth, torsoLen, now);

  hipTrail.push(hipMid);
  if (hipTrail.length > TRAIL_MAX) hipTrail.shift();

  let overallQuality = 'good';
  const worsen = (q) => {
    if (q === 'bad') overallQuality = 'bad';
    else if (q === 'okay' && overallQuality !== 'bad') overallQuality = 'okay';
  };

  const stats = [];

  if (cfg.primary && roles) {
    const q = classify(roles.primaryAngle, cfg.primary);
    worsen(q);
    stats.push({ label: `${cfg.primary.label} (${roles.primarySide})`, value: roles.primaryAngle.toFixed(0) + '°', q });
    if (activeSession) {
      const better = cfg.primary.higherIsBetter
        ? (activeSession.deepest === null || roles.primaryAngle > activeSession.deepest)
        : (activeSession.deepest === null || roles.primaryAngle < activeSession.deepest);
      if (better) activeSession.deepest = roles.primaryAngle;
      if (q === 'good') beep();
    }
  }
  if (cfg.secondary && roles) {
    const q = classify(roles.secondaryAngle, cfg.secondary);
    worsen(q);
    stats.push({ label: `${cfg.secondary.label} (${roles.secondarySide})`, value: roles.secondaryAngle.toFixed(0) + '°', q });
  }
  if (cfg.lean) {
    const q = classify(leanAngle, cfg.lean);
    worsen(q);
    stats.push({ label: cfg.lean.label, value: leanAngle.toFixed(0) + '°', q });
  }
  if (currentRPM !== null) {
    stats.push({ label: 'Spin rate (approx.)', value: currentRPM.toFixed(1) + ' rev/s', q: 'neutral' });
    if (activeSession) activeSession.rpms.push(currentRPM);
  }
  if (activeSession) {
    const rotations = Math.floor(activeSession.rotationHalfCount / 2);
    stats.push({ label: `Rotations (${activeSession.mode})`, value: String(rotations), q: 'neutral' });
  }

  stats.forEach(s => {
    const div = document.createElement('div');
    div.className = 'stat ' + (s.q || '');
    div.innerHTML = `<span class="label">${s.label}</span><span class="value">${s.value}</span>`;
    overlay.appendChild(div);
  });

  return overallQuality;
}

// ---- FPS tracking ----
let frameTimes = [];
function updateFps(now) {
  frameTimes.push(now);
  const cutoff = now - 1000;
  frameTimes = frameTimes.filter(t => t > cutoff);
  fpsBadge.textContent = frameTimes.length + ' fps';
}

function renderLoop() {
  if (!running) return;
  const now = performance.now();
  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const result = poseLandmarker.detectForVideo(video, now);
    ctx.save();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    if (result.landmarks && result.landmarks.length > 0) {
      const landmarks = result.landmarks[0];
      const pixelLandmarks = landmarks.map(p => ({ x: p.x * canvas.width, y: p.y * canvas.height, z: p.z }));
      const quality = updateStats(pixelLandmarks, now);
      drawHipTrail();
      drawSkeleton(landmarks, quality);
    } else {
      overlay.innerHTML = '<div class="stat">No person detected</div>';
    }
    ctx.restore();
    updateFps(now);
  }
  requestAnimationFrame(renderLoop);
}

startBtn.addEventListener('click', async () => {
  startBtn.style.display = 'none';
  try {
    await setupPoseLandmarker();
    await startCamera();
    running = true;
    statusEl.textContent = "Live — analyzing pose";
    renderLoop();
  } catch (err) {
    statusEl.textContent = "Error: " + err.message;
    startBtn.style.display = 'block';
  }
});

switchBtn.addEventListener('click', async () => {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  if (running) await startCamera();
});
</script>
