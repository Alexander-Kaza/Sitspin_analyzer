<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sit Spin Analyzer</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #container {
    position: relative; width: 100vw; height: 100vh;
  }
  video, canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  video { display: none; }
  #overlay {
    position: absolute; top: 0; left: 0; z-index: 5;
    width: 100%; padding: 12px;
    display: flex; flex-direction: column; gap: 6px;
    pointer-events: none;
  }
  .stat {
    background: rgba(0,0,0,0.55);
    color: #fff;
    padding: 6px 12px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    width: fit-content;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }
  .stat .label { opacity: 0.75; font-weight: 400; font-size: 12px; display: block; }
  .stat .value { font-size: 20px; }
  #status {
    position: absolute; bottom: 0; left: 0; width: 100%;
    padding: 14px; text-align: center;
    color: #fff; font-size: 14px;
    background: rgba(0,0,0,0.5);
    z-index: 10;
  }
  #startBtn {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    padding: 16px 32px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 30px;
    border: none;
    background: #ff3b30;
    color: white;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  #switchBtn {
    position: absolute; top: 12px; right: 12px; z-index: 10;
    background: rgba(0,0,0,0.55);
    color: #fff; border: none; border-radius: 10px;
    padding: 8px 14px; font-size: 14px;
  }
</style>
</head>
<body>
<div id="container">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
  <div id="overlay"></div>
  <button id="switchBtn">Flip camera</button>
  <button id="startBtn">Start Camera</button>
  <div id="status">Tap Start, then point the camera at the skater.</div>
</div>

<script type="module">
import {
  PoseLandmarker,
  FilesetResolver,
  DrawingUtils
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const switchBtn = document.getElementById('switchBtn');

let poseLandmarker = null;
let running = false;
let facingMode = 'environment'; // rear camera by default
let lastVideoTime = -1;
let currentStream = null;

const LM = {
  L_SHOULDER: 11, R_SHOULDER: 12,
  L_HIP: 23, R_HIP: 24,
  L_KNEE: 25, R_KNEE: 26,
  L_ANKLE: 27, R_ANKLE: 28
};

function angleBetween(a, b, c) {
  // angle at point b, formed by a-b-c, in degrees
  const v1 = { x: a.x - b.x, y: a.y - b.y };
  const v2 = { x: c.x - b.x, y: c.y - b.y };
  const dot = v1.x * v2.x + v1.y * v2.y;
  const mag1 = Math.hypot(v1.x, v1.y);
  const mag2 = Math.hypot(v2.x, v2.y);
  if (mag1 === 0 || mag2 === 0) return null;
  let cos = dot / (mag1 * mag2);
  cos = Math.max(-1, Math.min(1, cos));
  return Math.acos(cos) * (180 / Math.PI);
}

function torsoLeanAngle(shoulderMid, hipMid) {
  // angle from vertical axis, in degrees. 0 = perfectly upright.
  const dx = shoulderMid.x - hipMid.x;
  const dy = shoulderMid.y - hipMid.y;
  const angleFromVertical = Math.atan2(Math.abs(dx), Math.abs(dy)) * (180 / Math.PI);
  return angleFromVertical;
}

async function setupPoseLandmarker() {
  statusEl.textContent = "Loading pose model...";
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numPoses: 1
  });
  statusEl.textContent = "Model loaded. Point camera at skater.";
}

async function startCamera() {
  if (currentStream) {
    currentStream.getTracks().forEach(t => t.stop());
  }
  const constraints = {
    video: { facingMode: { ideal: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  };
  currentStream = await navigator.mediaDevices.getUserMedia(constraints);
  video.srcObject = currentStream;
  await video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
}

function drawSkeleton(landmarks) {
  const drawingUtils = new DrawingUtils(ctx);
  drawingUtils.drawLandmarks(landmarks, { radius: 4, color: '#00FF88' });
  drawingUtils.drawConnectors(landmarks, PoseLandmarker.POSE_CONNECTIONS, { color: '#00E0FF', lineWidth: 3 });
}

function updateStats(landmarks) {
  overlay.innerHTML = '';

  const lHip = landmarks[LM.L_HIP], rHip = landmarks[LM.R_HIP];
  const lKnee = landmarks[LM.L_KNEE], rKnee = landmarks[LM.R_KNEE];
  const lAnkle = landmarks[LM.L_ANKLE], rAnkle = landmarks[LM.R_ANKLE];
  const lShoulder = landmarks[LM.L_SHOULDER], rShoulder = landmarks[LM.R_SHOULDER];

  const leftKneeAngle = angleBetween(lHip, lKnee, lAnkle);
  const rightKneeAngle = angleBetween(rHip, rKnee, rAnkle);

  const hipMid = { x: (lHip.x + rHip.x) / 2, y: (lHip.y + rHip.y) / 2 };
  const shoulderMid = { x: (lShoulder.x + rShoulder.x) / 2, y: (lShoulder.y + rShoulder.y) / 2 };
  const leanAngle = torsoLeanAngle(shoulderMid, hipMid);

  const stats = [
    { label: 'Left knee angle', value: leftKneeAngle ? leftKneeAngle.toFixed(0) + '°' : '--' },
    { label: 'Right knee angle', value: rightKneeAngle ? rightKneeAngle.toFixed(0) + '°' : '--' },
    { label: 'Torso lean from vertical', value: leanAngle.toFixed(0) + '°' }
  ];

  stats.forEach(s => {
    const div = document.createElement('div');
    div.className = 'stat';
    div.innerHTML = `<span class="label">${s.label}</span><span class="value">${s.value}</span>`;
    overlay.appendChild(div);
  });
}

function renderLoop() {
  if (!running) return;
  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const result = poseLandmarker.detectForVideo(video, performance.now());
    ctx.save();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    if (result.landmarks && result.landmarks.length > 0) {
      const landmarks = result.landmarks[0];
      // convert normalized coords to pixel coords for drawing
      const pixelLandmarks = landmarks.map(p => ({ x: p.x * canvas.width, y: p.y * canvas.height, z: p.z }));
      drawSkeleton(landmarks); // DrawingUtils expects normalized coords + its own transform
      updateStats(pixelLandmarks);
    } else {
      overlay.innerHTML = '<div class="stat">No person detected</div>';
    }
    ctx.restore();
  }
  requestAnimationFrame(renderLoop);
}

startBtn.addEventListener('click', async () => {
  startBtn.style.display = 'none';
  try {
    await setupPoseLandmarker();
    await startCamera();
    running = true;
    statusEl.textContent = "Live — analyzing pose";
    renderLoop();
  } catch (err) {
    statusEl.textContent = "Error: " + err.message;
    startBtn.style.display = 'block';
  }
});

switchBtn.addEventListener('click', async () => {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  if (running) {
    await startCamera();
  }
});
</script>
</body>
</html>
